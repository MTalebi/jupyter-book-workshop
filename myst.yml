# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Interactive Computational Books Workshop
  description: Learn to create computational documents with Jupyter Book
  keywords:
    - jupyter-book
    - computational-documents
    - structural-engineering
    - interactive-publishing
  authors:
    - name: Mohammad Talebi-Kalaleh
      affiliations:
        - University of Alberta
      orcid: 0009-0004-3754-5992
      email: talebi@ualberta.ca
  github: MTalebi/jupyter-book-workshop
  jupyter: true

  abbreviations:
    SHM: Structural Health Monitoring
    FEM: Finite Element Method
    DOF: Degrees of Freedom
    FFT: Fast Fourier Transform
    PCA: Principal Component Analysis
    
  toc:
    - file: content/intro.md
    - file: content/chapter1.md
    - file: content/chapter2.md
    - file: content/Comprehensive MyST Documnet.md

  exports:
    - format: pdf
      template: plain_latex_book
      articles: content/Comprehensive MyST Documnet.md
      output: _build/exports/Comprehensive-MyST-Document.pdf
      id: comprehensive-myst-document-export
      line_numbers: true
site:
  template: book-theme
  options:
    favicon: images/favicon.ico
    logo_text: Example Jupyter Book
  analytics:
    google: G-QC60HQWPK2